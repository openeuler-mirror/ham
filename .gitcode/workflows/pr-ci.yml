name: UBS-HAM-Validation

on:
  workflow_call:
    inputs:
      pr_id:
        description: Pull request number
        required: true
        type: string
      target_branch:
        description: Pull request target branch
        required: true
        type: string
      merge_commit_sha:
        description: Pull request merge commit
        required: true
        type: string

env:
  PR_ID: ${{ inputs.pr_id }}
  TARGET_BRANCH: ${{ inputs.target_branch }}

defaults:
  run:
    shell: bash

permissions:
  repository: read
  pr: none
  issue: none
  note: none
  project: none

stages:
  checks_stage:
    name: Checks
    fail_fast: false
    jobs:
      pre_commit:
        name: pre-commit
        runs-on: [self-hosted, openeuler, arm, cpu=8]
        timeout-minutes: 30
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/soe:latest

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install pre-commit dependencies
            run: |
              set -euxo pipefail

              sudo yum install -y python3 python3-pip

              sudo python3 -m pip install \
                --index-url https://repo.huaweicloud.com/repository/pypi/simple \
                --trusted-host repo.huaweicloud.com \
                --timeout 120 \
                --retries 5 \
                "pre-commit==4.3.0" \
                "clang-format==12.0.1"

              clang-format --version

          - name: Prepare clang-format check
            run: |
              set -euxo pipefail

              sed -i 's/, -i/, -n, --Werror/g' .pre-commit-config.yaml

          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.1
            env:
              SKIP: run-build,run-build-test,clang-tidy,clang-tidy-test
            with:
              extra_args: --all-files

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/pre-commit
              else
                echo "FAILED" > .ci-results/pre-commit
              fi

              echo "pre-commit: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-pre-commit
              path: .ci-results/pre-commit

      build_x86_64:
        name: build-x86-64
        runs-on: [self-hosted, openeuler, x86, cpu=8]
        timeout-minutes: 5

        steps:
          - name: Preserve legacy x86_64 status
            run: |
              set -euo pipefail
              echo "UBTurbo 仅支持 aarch64；上游 x86_64 检查为历史占位项，保持 SUCCESS。"
              echo "x86_64=NOT_APPLICABLE" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/x86_64
              else
                echo "FAILED" > .ci-results/x86_64
              fi

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-x86-64
              path: .ci-results/x86_64

      build_aarch64:
        name: build-aarch64
        runs-on: [self-hosted, openeuler, arm, cpu=8]
        timeout-minutes: 60
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/soe:latest

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install dependencies
            run: |
              set -euxo pipefail

              sudo yum install -y \
                cmake \
                libboundscheck \
                libvirt \
                libvirt-devel

          - name: Build HAM release
            run: |
              set -euxo pipefail

              cmake -DCMAKE_BUILD_TYPE=release .
              make -j"$(nproc)" install

          - name: Upload HAM build output
            uses: upload-artifact
            with:
              name: ham-build-aarch64
              path: output/ham/

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/aarch64
              else
                echo "FAILED" > .ci-results/aarch64
              fi

              echo "aarch64: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-aarch64
              path: .ci-results/aarch64

      dt:
        name: DT
        runs-on: [self-hosted, openeuler, arm, cpu=8]
        timeout-minutes: 60
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install dependencies
            run: |
              set -euxo pipefail

              sudo yum install -y \
                git \
                curl \
                wget \
                gcc \
                gcc-c++ \
                make \
                cmake \
                libasan \
                libboundscheck \
                libvirt \
                libvirt-devel \
                dos2unix

          - name: Prepare mockcpp submodule
            run: |
              set -euxo pipefail
              git submodule update --init --recursive

          - name: Run HAM DT
            run: |
              set -euxo pipefail
              bash test/run_dt.sh

          - name: Upload DT reports
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ham-dt
              path: |
                test/build/gcovr_report/
                test/build/coverage.info
                test/build/gcovr_report/test_detail.xml

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/DT
              else
                echo "FAILED" > .ci-results/DT
              fi

              echo "DT: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-dt
              path: .ci-results/DT